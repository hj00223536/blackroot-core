name: p2p-v2-focused-tests

on:
  push:
    branches: [feature/p2p-v2-network-identity]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  p2p-v2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    name: P2P v2 focused tests (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install .
      - name: Test v2 codec and handshake transport
        run: python -m unittest discover -s tests -p 'test_p2p_handshake_v2.py' -v
      - name: Test transport compatibility and framing
        run: python -m unittest discover -s tests -p 'test_p2p_transport.py' -v
      - name: Test peer manager integration
        run: python -m unittest discover -s tests -p 'test_p2p_manager.py' -v
      - name: Test validated node configuration binding
        run: python -m unittest discover -s tests -p 'test_node_config.py' -v
