name: reference-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    name: Unit tests (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests with SQLite resource tracing
        env:
          PYTHONTRACEMALLOC: "10"
        run: |
          set -o pipefail
          python -u scripts/diagnose_sqlite_resource_warnings.py 2>&1 | tee resource-warning.log

  genesis-independent:
    runs-on: ubuntu-latest
    name: Independent genesis vector (Node.js 22)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reproduce genesis transaction, header, hash and proof of work
        run: node scripts/verify_genesis_candidate.mjs
      - name: Verify legacy transaction serialization and CompactSize vectors
        run: node scripts/verify_transaction_vectors.mjs
      - name: Verify P2PKH signature and SIGHASH_ALL vectors
        run: node scripts/verify_p2pkh_vectors.mjs
