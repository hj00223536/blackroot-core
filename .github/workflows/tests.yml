name: reference-tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests with SQLite resource tracing
        env:
          PYTHONTRACEMALLOC: "10"
        run: set -o pipefail
          python -W always::ResourceWarning -m unittest discover -s tests -v 2>&1 | tee resource-warning.log
